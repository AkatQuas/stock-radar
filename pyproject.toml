[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stock-radar"
version = "0.3.0"
description = "A-share stock screening & risk detection: 25 config-driven selectors, LLM review, daily CI reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "stock_radar contributors" }]
dependencies = [
  "pandas>=2.2,<3",
  "requests>=2.31",
  "tqdm>=4.66",
  "tushare>=1.4",
  "scipy>=1.11",
  "python-dotenv>=1.0",
  "pysnowball>=0.1.8",
  "baostock>=0.8.9",
  "lark-oapi>=1.6.5",
  "numpy>=1.26",
  "tickflow[all]>=0.1.22",
  "openai>=2.41.0",
  "PyYAML>=6.0",
  "numba>=0.60",
  "langfuse>=3.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pre-commit>=4.0"]

[project.scripts]
stock-fetch-list = "stock_radar.fetch_stocklist:main"
stock-fetch-kline = "stock_radar.fetch_kline:main"
stock-fetch-trend = "stock_radar.fetch_trend_pools:main"
stock-fetch-pool-kline = "stock_radar.fetch_pool_kline:main"
stock-is-trade-date = "stock_radar.is_trade_date:main"
stock-select = "stock_radar.select_stock:main"
stock-select-pool = "stock_radar.select_pool:main"
stock-detect-risk = "stock_radar.detect_risk:main"
stock-check = "stock_radar.check_code:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["stock_radar"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pre-commit>=4.0",
    "patch-package-py>=0.2.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["stock_radar"]
extend-exclude = [
  "data",
  "log",
  ".venv",
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "I",      # isort
  "W",      # pycodestyle warnings
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "RET",    # flake8-return
  "PIE",    # flake8-pie
  "RUF",    # ruff-specific
]
ignore = [
  "E501",   # line length (formatter handles wrapping)
  "B008",   # function call in default arg (common in argparse patterns)
  "RUF001", # fullwidth punctuation in Chinese UI strings
  "RUF002", # fullwidth punctuation in Chinese docstrings
  "RUF003", # fullwidth punctuation in Chinese comments
]

[tool.ruff.lint.per-file-ignores]
"stock_radar/try_play.py" = ["F401", "E402"]
"stock_radar/strategy/pipeline.py" = ["E701", "E702", "E741", "RET504", "SIM110", "SIM103"]

[tool.ruff.lint.isort]
known-first-party = ["stock_radar"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
